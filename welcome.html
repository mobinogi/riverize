<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f7">
<title>강서 도매소</title>
<link rel="icon" href="favicon.ico" type="image/png">

<style>
/* ── 웹 전체 공통 글꼴: SUIT ───────────────────────────── */
@font-face{
  font-family:'SUIT';
  /* 가변 폰트 인식용 3단 선언 */
  src:url('fonts/SUIT-Variable.woff2') format('woff2') tech(variations),
      url('fonts/SUIT-Variable.woff2') format('woff2-variations'),
      url('fonts/SUIT-Variable.woff2') format('woff2');
  /* ★ 이 줄이 있어야 볼드가 진짜 굵기로 그려집니다 */
  font-weight:100 900;
  font-style:normal;
  font-display:swap;
}

/* ── 색 (라이트 고정) ─────────────────────────────────── */
:root{
  --ground:#F4F6F7;
  --card:#FFFFFF;
  --field:#F0F3F4;
  --field-on:#E7ECEE;      /* 입력칸에 포커스 들어왔을 때 */
  --ink:#1A2320;
  --ink-2:#5F6B67;
  --ink-3:#9AA5A1;
  --accent:#0E7B68;        /* 생탁 로고 초록 */
  --accent-on:#0B6455;
  --warn:#C0392B;
  --shadow:0 18px 44px rgba(26,35,32,.10);
  --shadow-soft:0 6px 18px rgba(26,35,32,.07);
}

/* ── 기본 ────────────────────────────────────────────── */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:'SUIT','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

.stage{
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:
    calc(24px + env(safe-area-inset-top))
    20px
    calc(24px + env(safe-area-inset-bottom));
}

.card{
  width:100%;
  max-width:420px;
  background:var(--card);
  border-radius:28px;
  box-shadow:var(--shadow);
  padding:40px 32px 34px;
}

/* ── 머리말 ──────────────────────────────────────────── */
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:34px;
}
.brand img{
  height:46px;
  width:auto;
  border-radius:10px;
  display:block;
}
.brand span{
  font-size:18px;
  font-weight:700;
  letter-spacing:-.02em;
  color:var(--ink);
}

h1{
  margin:0 0 28px;
  font-size:26px;
  font-weight:700;
  letter-spacing:-.03em;
  line-height:1.35;
  text-wrap:balance;
}

/* ── 입력칸 ──────────────────────────────────────────── */
.field{
  -webkit-appearance:none;
  appearance:none;
  width:100%;
  border:0;                       /* 테두리 없음 */
  border-radius:16px;
  background:var(--field);
  color:var(--ink);
  font-family:inherit;
  font-weight:500;
  font-size:18px;
  letter-spacing:-.01em;
  padding:19px 20px;
  box-shadow:inset 0 2px 4px rgba(26,35,32,.05);   /* 눌러 넣는 자리처럼 보이게 */
  transition:background .18s ease, box-shadow .18s ease;
}
.field::placeholder{ color:var(--ink-3); font-weight:300; }

/* 포커스: 테두리·아웃라인 없이 배경과 그림자로만 표시 */
.field:focus{
  outline:none;
  background:var(--field-on);
  box-shadow:var(--shadow-soft);   /* 안쪽 그림자 → 바깥 그림자로 바뀌며 떠오름 */
}
.field:-webkit-autofill{
  -webkit-text-fill-color:var(--ink);
  -webkit-box-shadow:0 0 0 1000px var(--field) inset;
}

.notice{
  margin:11px 2px 0;
  font-size:13px;
  line-height:1.6;
  color:var(--warn);
  min-height:21px;      /* 메시지 떠도 버튼이 안 흔들리게 */
}

/* ── 버튼 ────────────────────────────────────────────── */
.go{
  -webkit-appearance:none;
  appearance:none;
  width:100%;
  border:0;
  border-radius:16px;
  background:var(--accent);
  color:#fff;
  font-family:inherit;
  font-weight:700;
  font-size:17px;
  letter-spacing:-.01em;
  padding:19px 0;
  margin-top:8px;
  cursor:pointer;
  transition:background .18s ease, transform .12s ease;
}
.go:hover{ background:var(--accent-on); }
.go:active{ transform:scale(.985); }
.go:focus{ outline:none; }
.go:focus-visible{ background:var(--accent-on); }

.foot{
  margin:24px 0 0;
  font-size:12.5px;
  line-height:1.75;
  color:var(--ink-3);
  text-align:center;
}

/* ── 저장 완료 화면 ──────────────────────────────────── */
.done{ display:none; text-align:center; padding:8px 0 4px; }
.done.on{ display:block; }
.form.off{ display:none; }
.check{
  width:60px;height:60px;
  margin:0 auto 22px;
  border-radius:50%;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
}
.check svg{ width:28px;height:28px;stroke:#fff;stroke-width:3;fill:none;
  stroke-linecap:round;stroke-linejoin:round; }
.done h2{ margin:0 0 8px; font-size:22px; font-weight:700; letter-spacing:-.02em; }
.done p{ margin:0; font-size:14px; line-height:1.7; color:var(--ink-2); }
.reset{
  margin-top:26px;
  background:none;border:0;padding:8px;
  font-family:inherit;font-size:12.5px;color:var(--ink-3);
  cursor:pointer;text-decoration:underline;text-underline-offset:3px;
}
.reset:focus{ outline:none; }
.reset:hover{ color:var(--ink-2); }

@media (max-width:400px){
  .card{ padding:34px 24px 28px; border-radius:24px; }
  h1{ font-size:23px; }
  .brand img{ height:42px; }
}
@media (prefers-reduced-motion:reduce){
  *{ transition:none !important; animation:none !important; }
}
</style>
</head>
<body>

<div class="stage">
  <main class="card">

    <!-- 입력 화면 -->
    <div class="form" id="form">
      <div class="brand">
        <img src="img/logo.png" alt="생탁">
        <span>강서 도매소</span>
      </div>

      <h1>성함을 입력해 주세요</h1>

      <input
        class="field"
        id="name"
        type="text"
        inputmode="text"
        autocomplete="name"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        maxlength="5"
        placeholder="예) 홍길동"
        aria-label="성함">

      <p class="notice" id="notice"></p>

      <button class="go" id="go" type="button">시작하기</button>

      <p class="foot">
        보안을 위한 확인 절차입니다.<br>
        첫 진입 시 한 번만 묻습니다.
      </p>
    </div>

    <!-- 저장 완료 화면 -->
    <div class="done" id="done">
      <div class="check">
        <svg viewBox="0 0 24 24"><polyline points="4 12.5 9.5 18 20 6.5"></polyline></svg>
      </div>
      <h2 id="hello">반갑습니다</h2>
      <p>확인되었습니다. 이제 앱으로 이동합니다.</p>
      <button class="reset" id="reset" type="button">다시 입력하기</button>
    </div>

  </main>
</div>

<script>
(function () {
  'use strict';

  var KEY = 'gangseo.user';        // 저장 이름표
  var NEXT = 'index.html';         // 저장 후 이동할 곳

  var form   = document.getElementById('form');
  var done   = document.getElementById('done');
  var input  = document.getElementById('name');
  var notice = document.getElementById('notice');
  var hello  = document.getElementById('hello');

  // localStorage가 막혀 있어도(시크릿 모드 등) 앱이 멈추지 않게 감쌉니다.
  function load() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }
  function save(v) {
    try { localStorage.setItem(KEY, v); return true; } catch (e) { return false; }
  }
  function drop() {
    try { localStorage.removeItem(KEY); } catch (e) {}
  }

  // 이미 저장돼 있으면 묻지 않고 바로 넘어갑니다.
  var saved = load();
  if (saved) {
    location.replace(NEXT);
    return;
  }

  function showDone(name) {
    hello.textContent = name + '님, 반갑습니다';
    form.classList.add('off');
    done.classList.add('on');
    setTimeout(function () { location.href = NEXT; }, 1200);
  }

  // 한글 이름만 받습니다. 숫자·영문·한자·특수기호·공백은 전부 막습니다.
  // (타이핑 중인 자모 ㄱ~ㅎ, ㅏ~ㅣ 는 살려둬야 글자가 안 깨집니다)
  var TYPING_OK = /[^가-힣ㄱ-ㅎㅏ-ㅣ]/g;   // 입력 중 허용 범위
  var NAME_OK   = /^[가-힣]+$/;            // 최종 검사 (완성된 글자만)

  function clean() {
    var before = input.value;
    var after  = before.replace(TYPING_OK, '');
    if (after === before) return;

    var cut = before.length - after.length;
    var pos = (input.selectionStart || after.length) - cut;
    input.value = after;
    try { input.setSelectionRange(pos, pos); } catch (e) {}
  }

  function submit() {
    var name = input.value.replace(/ /g, '').trim();

    if (!name) {
      notice.textContent = '성함을 입력해 주세요.';
      input.focus();
      return;
    }
    if (!NAME_OK.test(name)) {
      notice.textContent = '한글 이름만 입력해 주세요.';
      input.focus();
      return;
    }
    if (name.length < 2) {
      notice.textContent = '성함을 두 글자 이상 입력해 주세요.';
      input.focus();
      return;
    }
    if (name.length > 5) {
      notice.textContent = '성함이 너무 깁니다.';
      input.focus();
      return;
    }

    notice.textContent = '';

    if (!save(name)) {
      notice.textContent = '이 브라우저에서는 로그인이 되지 않습니다. 크롬으로 다시 열어 주세요.';
      return;
    }
    showDone(name);
  }

  document.getElementById('go').addEventListener('click', submit);

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submit();
  });
  // 한글은 조합 중에 값을 건드리면 글자가 깨집니다. 조합이 끝난 뒤에만 걸러냅니다.
  var composing = false;
  input.addEventListener('compositionstart', function () { composing = true; });
  input.addEventListener('compositionend', function () { composing = false; clean(); });

  input.addEventListener('input', function () {
    if (!composing) clean();
    if (notice.textContent) notice.textContent = '';
  });

  // 검수용: 저장된 값을 지우고 이 화면을 다시 볼 수 있게 합니다. (배포 시 지우셔도 됩니다)
  document.getElementById('reset').addEventListener('click', function () {
    drop();
    location.reload();
  });

  // PC에서는 바로 입력할 수 있게 커서를 둡니다.
  // (모바일은 키보드가 갑자기 올라오면 거슬려서 제외)
  if (!/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
    input.focus();
  }
})();
</script>

</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="85" height="60" viewBox="0 0 85 60">
  <!-- 짐칸: 흰색이어야 위에 얹는 생탁 로고(multiply)가 제 색으로 보입니다 -->
  <rect x="2" y="3" width="56" height="42" rx="3" fill="#ffffff" stroke="#37474F" stroke-width="2"/>
  <!-- 운전석 (오른쪽, 진행 방향) -->
  <path d="M60 18 h13 a3 3 0 0 1 2.6 1.5 l6.5 11 a3 3 0 0 1 .4 1.5 V47 a2 2 0 0 1 -2 2 H60 z"
        fill="#F4511E" stroke="#37474F" stroke-width="2" stroke-linejoin="round"/>
  <!-- 창문 -->
  <path d="M63 21 h9 l5.5 9.5 H63 z" fill="#B3E5FC" stroke="#37474F" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- 차체 받침 (아래 15px 는 바퀴 그림이 겹쳐 올라옵니다) -->
  <rect x="2" y="45" width="80" height="4" rx="1" fill="#37474F"/>
  <!-- 전조등 -->
  <rect x="79" y="38" width="3" height="4" rx="1" fill="#FFD54F"/>
</svg>

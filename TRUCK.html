<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>트럭 블러 테스트</title>
    <link rel="stylesheet" href="css/truck.css">
    <style>
        /* 실험용: 뒤에 깔릴 복잡한 배경 화면 */
        body {
            margin: 0;
            height: 100vh;
            /* 블러 효과 확인을 위한 임시 배경 이미지 (랜덤 자연 사진) */
            background: url('https://source.unsplash.com/random/1920x1080/?nature,forest') no-repeat center center/cover;
        }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="tr-scene">
            <div class="tr-mountain"></div>
            <div class="tr-hill"></div>
            <div class="tr-tree"></div>
            <div class="tr-tree"></div>
            <div class="tr-tree"></div>
            <div class="tr-rock"></div>
            <div class="tr-truck"></div>
            <div class="tr-wheels"></div>
        </div>
        <p id="loading-message-display" style="margin-top: 30px; text-align: center;">
            </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loadingText = document.getElementById('loading-message-display');
            
            if (loadingText) {
                // 1. 텍스트 설정
                const text = "매출현황표 배달중...";
                
                loadingText.innerHTML = '';
                loadingText.classList.add('flowing-text');

                // 2. 한 글자씩 쪼개기
                [...text].forEach((char, index) => {
                    const span = document.createElement('span');
                    span.textContent = char === ' ' ? '\u00A0' : char;
                    
                    // 🔥 [핵심] 가속도 딜레이 공식
                    // index(글자순서)가 커질수록 간격이 미세하게 좁아지거나
                    // 탄력적으로 변하도록 계산
                    
                    // 기본 0.1초씩 늘어나되, 약간의 곡선을 줌
                    const delay = index * 0.12; 
                    
                    span.style.animationDelay = `${delay}s`;
                    
                    loadingText.appendChild(span);
                });
            }
        });
    </script>

</body>
</html>

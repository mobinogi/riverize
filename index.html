  <style>
    /* (스타일은 그대로 유지) */
    body { font-family: 'Inter', sans-serif; background-color: #f7f9fc; font-size: 15px; }
    .tab-active { border-color: #10b981; color: #059669; background-color: #ecfdf5; }
    .date-box { width: 36px; height: 36px; display: flex; justify-content: center; align-items: center; border-radius: 9999px; cursor: pointer; transition: all 0.2s; background-color: transparent; border: none; box-shadow: none; flex-shrink: 0; }

    .report-exists:hover { background-color: #059669; transform: scale(1.05); }
    .no-report { color: #4b5563; cursor: pointer; }
    .no-report:hover { background-color: transparent; transform: none; }
    .sunday-date { color: #ef4444; cursor: default; }
    .sunday-date:hover { background-color: transparent; transform: none; }
    .today-highlight { border: 2px solid #ef4444; }
    .modal-overlay { background-color: rgba(0, 0, 0, 0.5); }
    .toggle-button {
      transition: all 0.2s;

      border: 1px solid #10b981;

      width: 100%; 
    }
    .toggle-active {
      background-color: #10b981;

    }
    #client-list-panel {
      position: absolute; 
      top: 0;
      left: 0;
      width: 33.3333%; 
      max-height: 100%;
      background-color: rgba(247, 249, 252, 0.7); 
      backdrop-filter: blur(4px);

      overflow-x: hidden;
    }
    #client-list-panel::-webkit-scrollbar { display: none; }
    #client-list-panel { scrollbar-width: none; }
    .client-list-minimized {
        width: 3rem !important;
    }
    .client-address { display: none; }
    @media (min-width: 768px) {
        .client-address { display: inline; }

    .map-close-button-new {
      position: absolute;
      top: 0.75rem;  /* 12px */
      right: 0.75rem; /* 12px */
      z-index: 20;  /* 목록(z-10)보다 위에 */
      
      background-color: transparent; /* 배경 없음 */
      color: #1f2937; /* 진한 회색 아이콘 */
      border-radius: 9999px; /* 원형 */
      padding: 0.5rem; /* 8px */
      
      cursor: pointer;
      transition: all 0.2s;
    }
/* 1. 기본 상태: 항상 이 위치에 고정됩니다 */
.map-close-button-new {
  position: absolute;
  top: 10px;
  right: 60px;   /* 스크롤바 왼쪽으로 배치 */
  z-index: 1000; /* 지도보다 위에 표시 */
  
  /* 버튼 기본 디자인 다듬기 (선택사항) */
  cursor: pointer;    /* 마우스 올리면 손가락 모양 */

}

/* 2. 마우스 오버 상태: 색깔만 변합니다 */

<div id="map-overlay" class="fixed inset-0 z-40 flex flex-col hidden bg-white" aria-modal="true">

    <div id="client-list-panel" class="p-4 overflow-y-auto border-r border-gray-200">
      
      <div class="flex flex-col space-y-2 mb-3"> 
        <button id="btn-toggle" onclick="togglePanelMinimize()" class="py-1 px-1 text-sm font-medium toggle-button">

</div>
  <script>
    // 1. 탭 제어 함수 (2개 탭용)
    function changeTab(tabName) {
      document.getElementById('tab-write').classList.remove('tab-active');
      document.getElementById('tab-review').classList.remove('tab-active');
      document.getElementById('content-write').classList.add('hidden');
      document.getElementById('content-review').classList.add('hidden');

      if (tabName === 'write') {
        document.getElementById('tab-write').classList.add('tab-active');
        document.getElementById('content-write').classList.remove('hidden');
      } else if (tabName === 'review') {
        document.getElementById('tab-review').classList.add('tab-active');
        document.getElementById('content-review').classList.remove('hidden');
        if (isDataLoading) showLoader(currentMonth + '월 달력 정보를 불러오는 중...');
        else renderCalendar();
      }
    }

    // ===============================================
    // 1. 전역 변수 및 초기 설정
    // ===============================================
    
    const API_URL = "https://script.google.com/macros/s/AKfycby5URDVswhQPo4sJwe2VQZxWRpDGv5F76AgHGA_AoXknJHUjVjgIbNmFT_qrQ8yDZ-2/exec"; 
    
    let reportsMap = {}; 
    let currentYear, currentMonth;
    let selectedDateForGeneration = null;
    let isDataLoading = false; 
    
    let isMapInitialized = false;     
    let loadedClientData = {};       
    let activeClientUser = null;     
    let isPanelMinimized = false;    

    // T맵 관련 전역 변수
    let currentMapInstance = null;
    let currentMarker = null; 
    const markerColors = {
        '김원대': 'blue', 
        '정병준': 'red'   
    };

    // ===============================================
    // 2. 유틸리티 함수
    // ===============================================

    function formatDate(date) {
      return date.getFullYear() + '년 ' + (date.getMonth() + 1) + '월 ' + date.getDate() + '일';
    }
    
    function showLoader(message) { document.getElementById('loading-message').textContent = message; document.getElementById('loading-overlay').classList.remove('hidden'); }
    function hideLoader() { document.getElementById('loading-overlay').classList.add('hidden'); }
    function openModal() { document.getElementById('confirm-modal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('confirm-modal').classList.add('hidden'); selectedDateForGeneration = null; }

    function getMobileOS() {
      const ua = navigator.userAgent;
      if (/android/i.test(ua)) return "Android";
      if (/iPad|iPhone|iPod/.test(ua)) return "iOS"; 
      return "Other";
    }
    
/**
     * [강제 실행 모드] 모바일에서는 무조건 앱(googlesheets://)으로 쏩니다.
     * 앱이 있다고 가정하므로, 빈 창(targetWindow)은 즉시 닫아버리고 앱을 띄웁니다.
     */
    function openSheetApp(url) {
      const os = getMobileOS();
      let appUrl = url;
      const fileIdMatch = url.match(/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      if (fileIdMatch && fileIdMatch[1]) {
        const fileId = fileIdMatch[1];
        if (os === "iOS") appUrl = "googlesheets://spreadsheet?id=" + fileId;
        else if (os === "Android") appUrl = "googlesheets://spreadsheet?id=" + fileId;
      }
      window.open(appUrl, '_blank');
    }
    
    // ===============================================
    // 3. T맵 통신 및 데이터 처리 함수 (Fetch API 사용)
    // ===============================================

    /**
     * ✅ [수정] T맵 지오코딩 함수 (jQuery/$.ajax 제거, Fetch API 사용)
     */
    async function geocodeAndSetMarker(address, user) {
        if (!currentMapInstance) return;

        if (currentMarker) {
            currentMarker.setMap(null);
            currentMarker = null;
        }

        const appKey = "QePeg5ee414bGfjbIx13L55PmUEim1vl9tvBSyp0";
        const markerImageUrl = markerColors[user] === 'red' ? 'pin_r_m_s.png' : 'pin_b_m_s.png';
        
        // TMAP API URL (Fetch용)
        const url = `https://apis.openapi.sk.com/tmap/geo/fullAddrGeo?version=1&format=json&coordType=WGS84GEO&fullAddr=${encodeURIComponent(address)}&appKey=${appKey}`;

        try {
            const response = await fetch(url);
            
            if (!response.ok) {
                 throw new Error(`API 호출 실패 (${response.status})`);
            }
            
            const data = await response.json();
            
            const resultInfo = data.coordinateInfo;
            if (!resultInfo || !resultInfo.coordinate || resultInfo.coordinate.length === 0) {
                throw new Error("요청 데이터가 올바르지 않거나 좌표를 찾을 수 없습니다.");
            }
            
            let lon, lat;
            const resultCoordinate = resultInfo.coordinate[0];
            
            if (resultCoordinate.lon && resultCoordinate.lon.length > 0) {
                lon = resultCoordinate.lon;
                lat = resultCoordinate.lat;
            } else if (resultCoordinate.newLon && resultCoordinate.newLon.length > 0) {
                lon = resultCoordinate.newLon;
                lat = resultCoordinate.newLat;
            } else {
                throw new Error("좌표를 찾을 수 없습니다.");
            }

            const markerPosition = new Tmapv2.LatLng(Number(lat), Number(lon));
            
            currentMarker = new Tmapv2.Marker({
                position: markerPosition,
                icon: markerImageUrl,
                iconSize: new Tmapv2.Size(24, 38),
                map: currentMapInstance,
                title: address
            });
            
            currentMapInstance.setCenter(markerPosition);
            currentMapInstance.setZoom(15);
            
            console.log(`[지오코딩 성공] ${address} -> Lat:${lat}, Lon:${lon}`);
            return markerPosition; // Promise<LatLng> 반환

        } catch (error) {
            console.error("Geocoding API 오류:", error);
            throw new Error(`API 호출 실패 (${error.message})`);
        }
    }

    /**
     * 지도에 단일 마커를 표시하고 중앙으로 이동시키는 함수 (클라이언트 클릭 시 호출됨)
     */
    async function setSingleMarkerAndCenter(client, user) {
        if (!currentMapInstance) return;

        if (client.coords) {
             const markerImageUrl = markerColors[user] === 'red' ? 'pin_r_m_s.png' : 'pin_b_m_s.png';
            
            if (currentMarker) { currentMarker.setMap(null); }
            
            currentMarker = new Tmapv2.Marker({
                position: client.coords,
                map: currentMapInstance,
                title: client.name,
                icon: markerImageUrl
            });
            currentMapInstance.setCenter(client.coords);
            currentMapInstance.setZoom(15);
            return;
        }

        try {
            const coords = await geocodeAndSetMarker(client.address, user);
            const userData = loadedClientData[user].find(c => c.name === client.name);
            if (userData) {
                userData.coords = coords; 
            }
        } catch(e) {
            alert(`[마커 생성 실패] 주소: ${client.address}. 오류: ${e.message}`);
            console.error("마커 생성 최종 실패", e);
        }
    }
    
    // ===============================================
    // 4. UI 및 이벤트 처리 함수 (메인 로직)
    // ===============================================

    async function fetchReportsForMonth(year, month, isInitialLoad = false) {
      const monthKey = year + '-' + month;
      if (reportsMap[monthKey] === 'completed') {
        renderCalendar();
        if (!isInitialLoad) preloadAdjacentMonths(year, month);
        return;
      }
      isDataLoading = true;
      if (!isInitialLoad) showLoader(month + '월 달력 정보를 불러오는 중...');
      try {
        const result = await callAppsScript('getReportFilesByMonth', { year, month });
        if (Array.isArray(result)) {
          result.forEach(report => { reportsMap[report.date] = report; });
          reportsMap[monthKey] = 'completed';
          document.getElementById('review-status').textContent = '✅ ' + month + '월 ' + result.length + '개 보고서 로딩 완료.';
        } else { 
          document.getElementById('review-status').textContent = '❌ 오류: ' + result.message; 
        }
      } finally {
        isDataLoading = false;
        hideLoader();
        renderCalendar();
        preloadAdjacentMonths(year, month);
      }
    }

    function preloadAdjacentMonths(year, month) {
        const prevDate = new Date(year, month - 2, 1);
        const prevYear = prevDate.getFullYear();
        const prevMonth = prevDate.getMonth() + 1;
        const prevMonthKey = prevYear + '-' + prevMonth;
        const nextDate = new Date(year, month, 1);
        const nextYear = nextDate.getFullYear();
        const nextMonth = nextDate.getMonth() + 1;
        const nextMonthKey = nextYear + '-' + nextMonth;
        if (!reportsMap[prevMonthKey]) {
            callAppsScript('getReportFilesByMonth', { year: prevYear, month: prevMonth }).then(result => {
                if (Array.isArray(result)) {
                    result.forEach(report => { reportsMap[report.date] = report; });
                    reportsMap[prevMonthKey] = 'completed';
                }
            });
        }
        if (!reportsMap[nextMonthKey]) {
            callAppsScript('getReportFilesByMonth', { year: nextYear, month: nextMonth }).then(result => {
                 if (Array.isArray(result)) {
                    result.forEach(report => { reportsMap[report.date] = report; });
                    reportsMap[nextMonthKey] = 'completed';
                }
            });
        }
    }
    
    async function changeMonth(delta) {
      const date = new Date(currentYear, currentMonth - 1 + delta, 1);
      currentYear = date.getFullYear();
      currentMonth = date.getMonth() + 1;
      fetchReportsForMonth(currentYear, currentMonth);
    }
    
    async function callAppsScript(action, params = {}) {
      if (action === 'getTmapApiKey') {
        console.warn("getTmapApiKey is deprecated. Key is now hardcoded.");
        return; 
      }
      
      const url = new URL(API_URL);
      url.searchParams.set('action', action);
      for (const key in params) {
        url.searchParams.set(key, params[key]);
      }
      try {
        const response = await fetch(url.toString(), {
          method: 'GET'
        });
        if (!response.ok) {
          throw new Error('HTTP 오류: ' + response.status);
        }
        return await response.json();
      } catch (error) {
        console.error('API 호출 오류:', error);
        return {
          status: 'error',
          message: error.message
        };
      }
    }
    
    async function generateTodayReport() {
      showLoader('오늘 일보를 생성 중...');
      try {
        const result = await callAppsScript('generate');
        if (result.status === 'success' && result.url) {
          hideLoader();
          openSheetApp(result.url);
          if (new Date().getMonth() + 1 === currentMonth) {
            fetchReportsForMonth(currentYear, currentMonth, true);
          }
        } else {
          hideLoader();
          alert('보고서 생성 실패: ' + result.message);
        }
      } catch (error) {
        hideLoader();
        alert('오류 발생: ' + error.message);
      }
    }
    
    async function createMonthlySummary() {
      showLoader(currentMonth + '월 매출현황 보고서를 생성 중...');
      try {
        const result = await callAppsScript('createSummary', {
          year: currentYear,
          month: currentMonth
        });
        if (result.status === 'success' && result.url) {
          hideLoader();
          openSheetApp(result.url);
        } else {
          hideLoader();
          alert('월별 통계 생성 실패: ' + (result.message || '알 수 없는 오류'));
        }
      } catch (error) {
        hideLoader();
        alert('월별 통계 생성 오류: ' + error.message);
      }
    }
    
    function onDateClick(day, isSunday) {
      if (isSunday) return;
      const formattedDate = currentYear + '-' + String(currentMonth).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      selectedDateForGeneration = formattedDate;
      const report = reportsMap[formattedDate];
      if (report && report.url) {
        openSheetApp(report.url);
      } else {
        const dateStr = currentYear + '년 ' + currentMonth + '월 ' + day + '일';
        document.getElementById('modal-message').innerHTML = '<b>' + dateStr + '</b> 일자의 보고서가 없습니다.<br>새로 작성하시겠습니까?';
        openModal();
      }
    }
    
    function renderCalendar() {
      const display = document.getElementById('current-month-display');
      if (!display) return;
      display.textContent = currentYear + '년 ' + currentMonth + '월';
      document.getElementById('summary-button-text').textContent = currentMonth + '월 매출현황표 생성 및 열기';
      const container = document.getElementById('calendar-days');
      if (!container) return;
      container.innerHTML = '';
      const firstDayOfMonth = new Date(currentYear, currentMonth - 1, 1);
      const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
      const startDayOfWeek = firstDayOfMonth.getDay();
      const today = new Date();
      const todayYear = today.getFullYear();
      const todayMonth = today.getMonth() + 1;
      const todayDay = today.getDate();

      for (let i = 0; i < startDayOfWeek; i++) container.innerHTML += '<div class="p-2"></div>';
      
      for (let day = 1; day <= daysInMonth; day++) {
        const isSunday = new Date(currentYear, currentMonth - 1, day).getDay() === 0;
        const isToday = todayYear === currentYear && todayMonth === currentMonth && todayDay === day;
        const dateKey = currentYear + '-' + String(currentMonth).padStart(2, '0') + '-' + String(day).padStart(2, '0');
        const isReportExists = reportsMap[dateKey];
        
        let boxClasses = ['date-box'];
        if (isSunday) {
          boxClasses.push('sunday-date');
        } else if (isReportExists) {
          boxClasses.push('report-exists');
        } else {
          boxClasses.push('no-report');
        }
        
        if (isToday && !isSunday) {
          boxClasses.push('today-highlight');
        }
        
        container.innerHTML += '<div class="p-2 flex justify-center items-center"><div class="' + boxClasses.join(' ') + '" ' + (isSunday ? '' : 'onclick="onDateClick(' + day + ', false)"') + '>' + day + '</div></div>';
      }
    }

    async function confirmGenerateReport() {
      if (!selectedDateForGeneration) { closeModal(); return; }
      const dateToGenerate = selectedDateForGeneration;
      closeModal();
      const [year, month, day] = dateToGenerate.split('-').map(Number);
      showLoader(year + '년 ' + month + '월 ' + day + '일 새 보고서를 생성 중...');
      try {
        const result = await callAppsScript('generateByDate', { year, month, day, shouldPropagate: true });
        if (result.status === 'success' && result.url) {
          if (result.newReport) reportsMap[result.newReport.date] = result.newReport;
          renderCalendar();
          openSheetApp(result.url);
        } else {
          alert('보고서 생성 실패: ' + (result.message || '알 수 없는 오류'));
        }
      } catch (error) {
        alert('보고서 생성 중 오류 발생: ' + error.message);
      } finally {
        hideLoader();
      }
    }
    
    // ===============================================
    // 5. T맵/목록 UI 함수
    // ===============================================

    /**
     * '오버레이 열기' 버튼
     */
    function openMapOverlay() {
      console.log("지도 열기 버튼 클릭.");
      
      document.getElementById('map-overlay').classList.remove('hidden');
      
      if (!isMapInitialized) {
        console.log("맵이 없으므로, 지금부터 생성합니다...");
        try {
          // 지도 객체를 전역 변수에 저장
          currentMapInstance = new Tmapv2.Map("map_overlay_content", {
            center: new Tmapv2.LatLng(35.2128, 128.9806),
            width: "100%",
            height: "100%",
            zoom: 12
          });
          
          isMapInitialized = true; 
          console.log("지도 생성 성공!");

        } catch (e) {
          console.error("지도 생성 실패:", e);
          document.getElementById('map_overlay_content').textContent = "지도 생성 실패: " + e.message;
        }
      }
      
      if (Object.keys(loadedClientData).length === 0 || !activeClientUser) {
         const targetUser = activeClientUser || '김원대';
         const targetButton = document.getElementById(`btn-${targetUser === '김원대' ? 'kim' : 'jung'}`);
         if (targetButton) {
             toggleClientList(targetUser, targetButton);
         }
      }
    }

    /**
     * '닫기' 버튼
     */
    function closeMapOverlay() {
      document.getElementById('map-overlay').classList.add('hidden');
    }
    
    /**
     * 목록 패널을 축소/확대하는 함수
     */
    function togglePanelMinimize() {
        const panel = document.getElementById('client-list-panel');
        const icon = document.getElementById('toggle-icon');
        
        panel.classList.toggle('client-list-minimized');
        isPanelMinimized = !isPanelMinimized;

        icon.textContent = isPanelMinimized ? '▶️' : '◀️';
    }

    /**
     * 거래처 목록을 code.js에서 불러와서 메모리에 저장하는 함수
     */
    async function fetchClientList(user) {
        if (loadedClientData[user]) return; 
        
        try {
            const result = await callAppsScript('getClients', { user: user });
            if (result.status === 'success' && result.clients.length > 0) {
                loadedClientData[user] = result.clients.map(client => ({ ...client, coords: null })); 
            } else {
                loadedClientData[user] = []; 
                console.warn(`거래처 목록 로드 실패 (${user}): ${result.message || '거래처 없음'}`);
            }
        } catch (e) {
            console.error(`거래처 목록 로드 오류 (${user}):`, e);
            loadedClientData[user] = []; 
        }
    }

    /**
     * 실제 목록을 화면에 뿌리는 함수
     */
    function displayClientList(user, clients) {
        const container = document.getElementById('client-list-container');
        
        if (clients.length === 0) {
            container.innerHTML = `<p class="text-red-600 text-sm p-2">거래처 목록이 없습니다 (${user}).</p>`;
            return;
        }

        const listUl = document.createElement('ul');
        listUl.id = `list-${user}`;
        
        for (const client of clients) {
            const li = document.createElement('li');
            li.className = 'p-2 border-b border-gray-300 hover:bg-gray-200 cursor-pointer text-sm';
            
            li.innerHTML = `<strong>${client.name}</strong><span class="text-gray-500 text-xs client-address"> (${client.address})</span>`; 
            
            // 목록 클릭 시 지도 중앙 이동 이벤트
            li.onclick = () => {
                setSingleMarkerAndCenter(client, user); 
            }; 
            listUl.appendChild(li);
        }
        container.innerHTML = ''; 
        container.appendChild(listUl);
    }
    
    /**
     * 버튼 클릭 시 목록을 토글하고 데이터를 불러오는 메인 함수
     */
    async function toggleClientList(user, buttonElement) {
        const container = document.getElementById('client-list-container');
        const allButtons = document.querySelectorAll('#client-list-panel button');
        
        // 1. 버튼 활성화/비활성화 상태 변경
        allButtons.forEach(btn => {
            if (btn.id !== 'btn-toggle') {
                 btn.classList.remove('toggle-active');
            }
        });
        
        if (activeClientUser === user) {
            activeClientUser = null;
            container.innerHTML = '<p class="text-sm text-gray-500 p-2">담당자를 선택해주세요.</p>';
            if (currentMarker) {
                currentMarker.setMap(null);
                currentMarker = null;
            }
            return;
        }
        
        buttonElement.classList.add('toggle-active');
        activeClientUser = user;

        // 2. 데이터 로드 및 화면 표시
        container.innerHTML = `<p class="text-sm text-gray-500 p-2">목록 로딩 중... (${user})</p>`;
        
        if (!loadedClientData[user]) {
            await fetchClientList(user);
        }
        
        // 3. 목록 표시
        displayClientList(user, loadedClientData[user]);
        
        // 4. 목록을 표시한 후, 혹시 미니멀 모드였다면 확장
        if (isPanelMinimized) {
            togglePanelMinimize();
        }
    }
    
    // ===============================================
    // 6. 🚀 앱 시작 (시동)
    // ===============================================
    document.addEventListener('DOMContentLoaded', () => {
      const today = new Date();
      currentYear = today.getFullYear();
      currentMonth = today.getMonth() + 1;
      
      document.getElementById('current-date').textContent = formatDate(today);
      document.getElementById('generate-button').disabled = false;
      document.getElementById('app-status').textContent = '상태: 준비 완료.';
      
      fetchReportsForMonth(currentYear, currentMonth, true);
    });
    
  </script>
